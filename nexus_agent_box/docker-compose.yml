# ============================================================================
#  沙盒服务（FastAPI / E2B）容器
# ----------------------------------------------------------------------------
#  ⚠️ P3-3 修掉的坑：原先这里同时写了 `build: .` 和把源码目录挂进去的 volumes。
#     结果是「镜像里有代码，运行时又被宿主机目录盖掉」：
#       · 改了代码却没生效（或反过来：没改却生效了），是最难排查的一类问题；
#       · 同一个镜像在不同机器上跑出不同行为 —— 镜像不再是可信的交付物。
#     现在的分工：
#       · **本文件 = 以镜像为准**（改代码必须 `docker compose up -d --build`）；
#       · **docker-compose.override.yml = 开发用**，Compose 会自动合并它，
#         把源码挂回去实现热重载（`docker compose up` 默认就带上）。
#     CI / 生产要跳过 override，显式指定文件即可：
#       docker compose -f docker-compose.yml up -d --build
#
# ----------------------------------------------------------------------------
#  🆕 2026-10-07：独立部署（web 与 box 分开跑）时的注意事项
# ----------------------------------------------------------------------------
#  实际生产可能是「web 一个 compose、box 另一个 compose」（甚至两台机器），
#  与仓库根目录 docker-compose.server.yml 那种「一套起」的方式不同。两种都对，
#  但要注意三件事：
#
#  1. **本文件用 `ports` 对外暴露 8000，而整套部署用的是 `expose`（仅容器网络内）。**
#     独立部署必须对外暴露，否则 Java 侧连不上。
#
#  2. 🔴 **Java 侧的 `BASE_URL` 必须改成 box 的实际地址**（IP 或域名 + :8000），
#     例如 http://106.x.x.x:8000。整套部署里写的是 http://box:8000 —— 那是
#     compose 网络的**服务名**，只在"一套起"时才解析得通，独立部署会一直
#     连不上（表现为所有沙盒工具都失败）。
#
#  3. ⚠️ **独立部署请显式带 `-f docker-compose.yml`**：
#     不带的话 Compose 会自动合并 override.yml，把宿主机源码挂进容器 ——
#     那样"跑的代码 ≠ 镜像里的代码"，改代码不 rebuild 就生效很容易被误当成
#     "配置生效了"，排查时极难察觉。
#
#     # 生产（以镜像为准）
#     docker compose -f docker-compose.yml up -d --build
#     # 本地开发（挂源码，改完 restart 即可）
#     docker compose up -d
# ============================================================================

services:
  nexus-agent-box:
    build: .
    container_name: nexus-agent-box
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      # 探 /docs：FastAPI 起来后这个页面一定在，且**不依赖 E2B Key 是否有效**。
      # 若去探业务接口，Key 配错时容器会被判成不健康而反复重启，掩盖真正的原因。
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
