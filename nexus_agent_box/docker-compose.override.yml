# ============================================================================
#  开发用覆盖文件（Compose 会自动合并，不需要 -f 指定）
# ----------------------------------------------------------------------------
#  只做一件事：把源码目录挂回容器，改代码后**重启容器即可**，不用重建镜像。
#
#  ⚠️ 这是刻意与主文件分离的 —— 挂载源码意味着「跑的代码 ≠ 镜像里的代码」，
#     只适合本地开发，绝不能进生产镜像 / CI。
#     要跑"与镜像一致"的版本：
#        docker compose -f docker-compose.yml up -d --build
#
#  ⚠️ uvicorn 默认没有 --reload，所以改完代码仍需
#        docker compose restart nexus-agent-box
#     （真要自动重载可以在主文件的 Dockerfile CMD 上加 --reload，
#      但那会让生产镜像也带上 reload，故不做。）
# ============================================================================

services:
  nexus-agent-box:
    volumes:
      - ./app:/app/app
      - ./main.py:/app/main.py
