# ============================================================================
#  运行时外部配置 —— 改这里**不用重新构建镜像**
# ----------------------------------------------------------------------------
#  docker-compose.server.yml 已把本目录挂载到容器的 /app/conf（只读），
#  并设了 SPRING_CONFIG_ADDITIONAL_LOCATION=optional:file:/app/conf/nexus-override.yml。
#
#  作用：本文件的优先级**高于** jar 包内的 application-prod.yml。
#  改完只要：
#      docker compose -f docker-compose.server.yml restart app
#  十几秒生效，不用重新 build、不用重新上传 jar。
#
#  ⚠️ 两个必须知道的坑：
#
#  1. **列表是整体替换，不是合并。**
#     下面写 `nexus.agent.system-models` 会把 jar 内那份列表**整个顶掉** ——
#     只写一个模型，jar 内配的其它模型就全没了。所以要列就把想用的**全列出来**。
#
#  2. **jar 内那份最好删干净**（application-prod.yml 里把 system-models 整段去掉，
#     连注释一起删）。否则两份配置并存，日志里到底哪个生效很难查。
#     删掉后本文件就是唯一来源，最省心。
#
#  生效验证（启动后跑一次，数量对得上就说明读到了）：
#      docker compose -f docker-compose.server.yml logs app | grep "系统模型已就绪"
#
#  💡 环境变量（API Key 等）仍然写在根目录的 .env 里，本文件用 ${XXX} 占位符引用即可。
#     完整说明见 docs/部署指南（改配置不重打包）.md
#
#  🔴 2026-10-09 补充：**API Key 这类配置项，本文件与 .env 写哪边都行，但要看代码怎么读**。
#     本文件能配的只有「Spring 配置项」；而代码里写成 System.getenv 的那些，
#     只认**真实的进程环境变量**，写在这里一律读不到 —— 现象就是
#     「我明明写到配置文件里了，日志却说没配置」。
#     排查自检：启动日志的「生效配置快照」会写明每一项的**值 + 来源**，
#     写到本文件却没生效的，那一行会显示来源不是本文件。
#     例：联网搜索的 Key 两条路都通（配置项 nexus.agent.websearch.api-key 或环境变量 TAVILY_API_KEY），
#     见下面那段示例。
# ============================================================================

# 联网搜索 / 网页正文提取的 API Key（Tavily）。
# 两条路任选其一，**配置项优先**：
#   ① 直接写在 .env 里（推荐，与其它密钥统一）：TAVILY_API_KEY=tvly-xxx
#   ② 解开下面这段写在这里（等价，适合不想动 .env 的场景）；
#      也可以用 ${TAVILY_API_KEY} 引用 .env 里的值。
# 不配不影响其它功能，只是 web_search / web_extract 两个工具**不注册**（模型看不到）。
#
# nexus:
#   agent:
#     websearch:
#       api-key: ${TAVILY_API_KEY}

# 下面整段默认注释掉 —— 需要改模型时，解开并按需修改。
# 字段含义详见 docs/模型能力配置（前端）.md（只有 modelName 必填，id/name 可省）。
#
# nexus:
#   agent:
#     system-models:
#       - id: deepseek
#         name: DeepSeek
#         baseUrl: https://api.deepseek.com
#         apiKey: ${DEEPSEEK}
#         models:
#           - modelName: deepseek-chat
#             name: DeepSeek-V3
#             contextWindow: 131072
#             maxOutputTokens: 8192
#       - id: qwen
#         name: 阿里云百炼
#         baseUrl: https://dashscope.aliyuncs.com/compatible-mode/v1
#         apiKey: ${ALI_AI_KEY}
#         models:
#           - modelName: qwen3-max
#             name: 通义千问-Max
#           - modelName: qwen-vl-max
#             name: 通义千问-VL（支持看图）
#             vision: true

# ============================================================================
#  上传大小（2026-10-04）
# ----------------------------------------------------------------------------
#  jar 内的 application.yml 现在是：单文件 20MB / 整个请求 30MB。
#  想调而**不想重新构建镜像**，就把下面这段解开写在这里 —— 本文件优先级高于 jar 内的
#  application.yml，改完 `docker compose -f docker-compose.server.yml restart app` 即可。
#
#  ⚠️ 三处必须一起对齐，少一处就会表现为「上传报 502」：
#    1) 下面这两个值 —— 超了 Spring 直接拒（后端回 413 + 中文提示）
#    2) 网关（Nginx）的 client_max_body_size —— 必须 >= max-request-size，
#       不配就是默认的 1m，超了返回 413 且请求根本到不了后端
#    3) 网关的读超时（proxy_read_timeout）—— 大文件 + 慢网时先超时的是网关
# ============================================================================
#
# spring:
#   servlet:
#     multipart:
#       max-file-size: 20MB
#       max-request-size: 30MB
