langchain4j:
  open-ai:
    chat-model:
      model-name: moonshot-v1-8k
      base-url: https://api.moonshot.cn/v1
      api-key: ${MOONSHOT}
    # ⚠️ 2026-10-03：这一段是**最后兜底** —— 配了下面的 nexus.agent.system-models 之后
    #    正常不会被用到，也可以整段删掉（删了之后 ${DEEPSEEK} 环境变量也不再需要）。
    #    以前它是**必填**的：不写应用启动就失败，于是"不想用 DeepSeek 了"根本做不到。
    # ⚠️ 但 chat-model（会话标题生成）**不能删**，删了标题生成不了。
    #    2026-10-04：embedding-model 一并删掉了 —— 本地知识库（pgvector）已下线。
    #    向量化只在入库/检索时用，而第三方知识库（乐享）的向量化由对方服务自己做。
    #    2026-10-05：阿里百炼的 Key（ALI_AI_KEY）也不再是必填环境变量，但**原因换了** ——
    #    百炼已从下面的 nexus.agent.system-models 里移除（第二个供应商换成小米 MIMO），
    #    prod 不再引用它。跟 pgvector 无关了。
    streaming-chat-model:
      model-name: deepseek-flash
      base-url: https://api.deepseek.com
      # ⚠️ 这里是**系统默认模型**的固定额外参数（由 langchain4j starter 直接下发，
      #    不经过 nexus.agent.model.providers 能力表）。只放该服务商认的字段 ——
      #    不认的字段可能让请求直接 400。下面按 DeepSeek 官方接口配置（无 enable_search）；
      #    若换成阿里云百炼(qwen)等支持联网搜索的服务商，可自行加上 enable_search: true。
      custom-parameters:
        enable_thinking: true
      api-key: ${DEEPSEEK}
      return-thinking: true

spring:
  datasource:
    # 注意：多个 JDBC 参数之间必须用 & 分隔。
    # 历史上这里是 ...=true?stringtype=unspecified，第二个 '?' 让整个 query 被解析成一个
    # 参数值，导致 reWriteBatchedInserts 与 stringtype 双双失效；
    # 而 stringtype=unspecified 是 chat_memory.content::jsonb 等写入正常工作的前提。
    url: jdbc:postgresql://${SERVICE_IP}:5432/nexus_agent?reWriteBatchedInserts=true&stringtype=unspecified
    password: ${DATABASE}
    # 2026-10-03：原先**写死** postgres —— 数据库用户名不是 postgres 的环境（比如用户名是 hu）
    # 无论怎么改配置都连不上，报 password authentication failed for user "postgres"。
    # 改成占位符：环境变量 DB_USERNAME 或配置文件里写 DB_USERNAME=xxx 都能覆盖，
    # 不填时仍是 postgres（保持旧行为）。
    username: ${DB_USERNAME:postgres}
    hikari:
      maximum-pool-size: 100
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 550000
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 60000
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  aliyun:
    bucket-name: nexus-agent-file
    region: cn-guangzhou
    endpoint: https://oss-cn-guangzhou.aliyuncs.com
    image-dir: user/avatar
    # OSS 凭证（2026-10-02 补）：
    #   · 有这两个环境变量 → 用它们（冒号后是默认值，缺了不报错而是留空）
    #   · 环境变量没设 → 可以在 .env.properties / 面板配置里写
    #     spring.aliyun.access-key-id / access-key-secret，照样生效
    # ⚠️ 为什么不能直接只靠环境变量：aliyun-sdk-oss 的
    #    EnvironmentVariableCredentialsProvider 走 System.getenv()，绕开 Spring，
    #    写在配置文件里它完全看不到（上传时抛 InvalidCredentialsException）。
    #    现在 AliOssUtil 改成"配置优先、环境变量兜底"，两种写法都认。
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    file-dir: user/file
  data:
    redis:
      host: ${SERVICE_IP}
      password: ${REDIS_PWD}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

# ============================================================================
#  系统内置模型（**没配自带 Key 的用户**用的那批）—— 2026-10-03
# ----------------------------------------------------------------------------
#  ⚠️ 这一段是**注释状态**：不配时行为完全不变（仍用上面 langchain4j 那一个默认模型）。
#     想加模型 / 换供应商 / 同时挂好几家，就把它解开照着写 —— 每家一项，互不影响。
#
#  结构：一家供应商一项（baseUrl + apiKey 只写一次），**该项下 models 挂多个模型**。
#
#  供应商级字段：
#    id / name   供应商标识与展示名（前端可按它分组）
#    baseUrl     OpenAI 兼容地址（决定"思考/联网"参数怎么下发）
#    apiKey      该服务商的 Key，建议写成占位符 ${XXX}
#    models      该供应商下的模型列表
#
#  模型级字段（models[] 里每一项）—— **只有 modelName 是必填的**：
#    modelName   实际发给服务商的模型名（**唯一必填项**）
#    name        展示名，可选，默认 = modelName。想让选择器显示得好看点才写（如"DeepSeek-V3"）
#    id          本系统内的唯一键，可选，默认 = modelName。
#                99% 的情况**不用写** —— 只有"两家供应商有同名模型"（如百炼和某代理都叫
#                deepseek-chat）时，才给其中一个单独指定，否则两行会撞 id、后者覆盖前者
#    vision / contextWindow / maxOutputTokens
#                可选，不填时**继承供应商级**同名配置，再没有才用默认值（false / 256000 / 32000）
#
#  所以最简写法就是每行只写一个 modelName：
#       models:
#         - modelName: deepseek-chat
#         - modelName: deepseek-reasoner
#
#  💡 旧写法（一项 = 一个模型，modelName 直接写在供应商上）也仍然支持。
#
#  前端可用 GET /api/chat/models 拿到这里配的列表（不含密钥，带 providerId 便于分组）。
# ============================================================================
#  nexus-agent 运行时参数（全部有代码默认值，不写这段也能启动）
# 对应类：com.huzhijian.nexusagentweb.properties.AgentProperties
# ============================================================================
nexus:
  agent:
    system-models:
      - id: deepseek
        name: DeepSeek
        baseUrl: https://api.deepseek.com
        apiKey: ${DEEPSEEK}
        models:
          - modelName: deepseek-flash
            name: flash
            vision: true
            contextWindow: 1000000
            maxOutputTokens: 384000
      - id: MIMO
        name: 小米
        # ⚠️ 2026-10-05 修正：这里原先是 https://dashscope.aliyuncs.com/compatible-mode/v1
        #    —— 那是**阿里百炼**的地址，只是把 id/name 换成了小米、apiKey 换成了 ${MIMO}，
        #    baseUrl 忘了改。结果拿小米的 Key 去敲阿里的门 →
        #    Incorrect API key provided（help.aliyun.com/zh/model-studio/error-code#apikey-error）。
        #    换供应商时 baseUrl / apiKey / id / name 必须**成套**改，
        #    这是今天第三处「改了一半」（前两处：pg 驱动、CORS）。
        baseUrl: https://api.xiaomimimo.com/v1
        apiKey: ${MIMO}
        models:
          - modelName: mimo-v2.6-pro
            name: Pro
            contextWindow: 1000000
            vision: true
          - modelName: mimo-v2.6-flash
            name: Flash
            vision: true
            contextWindow: 1000000
      # ⚠️ 生产**默认关闭**：一旦开启，allowed-origins 里写的每个网站都能带着用户 token
      #    读取本服务的响应，等于把后端的攻击面又往外扩了一圈。
      # 需要前后端分离部署时，把它改成 true 并列出**精确域名**（不要写 '*'）：
      #   allowed-origins: https://app.example.com
      # 同源部署（Nginx 把前端静态资源与 /api 挂在同一个域名下）就完全不用开。
    sse:
      # ❗ 这里【不要】写 nexus.agent.sse.timeout —— prod 的属性源优先级高于代码默认值，
      #    写了就会盖掉 AgentProperties 里的默认（1800s）。
      #    2026-10-05 的「任务 2 分钟被掐断」就是原本残留在这里的 timeout: 120s 干的：
      #    2026-10-03 修复时只改了 Java 默认值，漏了 prod 这份，而用户以 prod profile 运行。
      #    真要调整超时，去改 AgentProperties.Sse.timeout 的默认值（全项目唯一事实源）。
      #    已有 SseTimeoutDriftTest 盯着：这里再出现该键会直接测试失败。
      # 流式增量合并（P2-12）：攒够这么多字符就推一帧。
      # 调大 → SSE 帧更少、前后端更省，但首字/整段到达略慢；调小 → 更"实时"但帧多、前端渲染压力大
      flush-max-chars: 200
      # 兜底时间阈值：距上次推送超过这么久就推一帧（60ms ≈ 16 帧/秒，与屏幕刷新率相当）
      flush-interval: 60ms
    memory:
      # 对话记忆窗口的 token 上限（只影响送给模型的上下文，不影响已入库的消息）
      max-tokens: 100000
      # token 估算器使用的模型名。注意它只用于本地估算，不产生 API 调用；
      # 与真实使用的模型不一致会导致窗口裁剪不准，换主力模型时建议同步改
      token-estimator-model: gpt-4o
      # ---- 长期记忆检索（P2-7 / 决策 D4 = pg_trgm）----
      # 单次检索最多返回多少条（会拼进系统提示词，太多既费 token 又稀释重点）
      max-results: 20
      # 一次查询最多拆几个关键词（模型可能丢一整句话进来，拆太多命中会变"什么都相关"）
      max-keywords: 6
      # 字面匹配一条都没中时，是否再用 pg_trgm 的 similarity() 兜底模糊匹配。
      # ⚠️ 依赖 pg_trgm 扩展（docs/sql/006_add_user_memory_trgm_index.sql）；
      #    没装不会报错，会捕获首次失败并降级为纯字面匹配，只在日志里 WARN 一次
      fuzzy: true
      # 兜底的最低相似度（0~1）。中文短句三元文法重叠率天然偏低，故低于 PG 默认的 0.3
      fuzzy-min-score: 0.15
      # 单条记忆最大字符数，写入时截断
      max-content-length: 500
      # 写入去重阈值（0~1）：与已有记忆相似度达到该值即判重复丢弃
      dedup-threshold: 0.85
    sandbox:
      # 是否按会话复用沙盒。开启后同一会话内多次工具调用复用同一个沙盒（E2B 按量计费）
      reuse-per-session: true
      # 沙盒空闲多久后被后台任务主动销毁。
      # ⚠️ 必须小于沙盒服务里的 set_timeout(600)，否则还没轮到我们回收就被 E2B 收走了
      idle-timeout: 8m
      # 回收任务的执行间隔（毫秒，或 ISO-8601 时长）
      sweep-interval: 60000
    mcp:
      # MCP 客户端健康检查超时
      health-timeout: 5s
      # 是否缓存复用 MCP 客户端（关闭会导致每轮对话新建连接，必然泄漏）
      cache-clients: true
    security:
      # 是否启用登录鉴权。默认 true（安全优先）。
      # ⚠️ 本地调试若不想带 token，请在这里（自己不提交的 application-dev.yml）显式设为 false，
      #    不要注释掉 WebInterceptorConfig 上的 @Configuration —— 那样没有任何痕迹、容易误提交。
      #    关闭时启动日志会打 WARN 提醒。
      enabled: true
    skill:
      # 是否启用技能（总开关：官方 + 用户技能都受影响）
      enabled: true
      # ⚠️ 仅「官方技能」的根目录：每个子目录一个技能，内含 SKILL.md（frontmatter 提供 name/description）
      # 目录约定与用法见 skills/README.md
      # ⚠️ **绝对不要指向用户可写的目录** —— 用户上传的技能存 DB（user_skill 表），不解压落盘
      root-dir: skills
      # ⚠️ 仅影响官方技能。用户技能是实时查库的，上传完立即生效，不受此缓存影响
      refresh-interval: 60s
    startup:
      # 启动配置自检发现「必需配置缺失」时是否直接阻止启动。
      # true（默认）：fail-fast，启动日志会一次性列出缺哪些、各自什么后果
      # false：降级为 WARN 继续启动，仅建议临时排查问题时用
      fail-fast: true
    tools:
      # 工具发起的 HTTP 调用（沙盒服务）响应超时。
      # ⚠️ 刻意小于 sse.timeout（AgentProperties 默认 1800s）：这样超时先由工具层抛出，
      #    变成结构化的 TIMEOUT 结果回给模型，而不是把整条 SSE 流掐断。
      #    长任务（沙盒里装依赖、跑大数据量脚本）可调大，但别超过 sse.timeout。
      http-timeout: 100s
      # 重复调用治理：同一会话内「同一工具 + 完全相同的参数」在窗口内超过阈值即拦截，
      # 返回 DUPLICATE_CALL 结构化结果 + 自纠提示。设为 0 关闭该治理。
      duplicate-window: 60s
      duplicate-threshold: 2
    observability:
      # 是否输出每次运行的汇总日志：
      #   RUN runId=... session=... model=... cost=7.6s tokens=1234/567/1801(in/out/total)
      #       fee=¥0.0071 tools=3 seq=[create_box,execute_cmd] result=OK
      enabled: true
      # 模型单价（每 100 万 token，单位：元）。**故意不给默认值** —— 各厂商价格经常变动，
      # 写死在代码里必然过时并给出错误金额；没配的模型汇总里显示 fee=unpriced（明确表示"不知道"）。
      # 匹配规则：先精确匹配模型名，再按最长前缀匹配（配 deepseek 即可覆盖 deepseek-v4-flash）。
      # 示例（价格请以厂商官网为准）：
      # model-prices:
      #   deepseek:
      #     input: 2.0
      #     output: 8.0
      model-prices: {}
    model:
      # 服务商能力表（P2-3）：key = baseUrl 中包含的片段，决定「给该服务商下发哪些额外参数」。
      # 内置：dashscope.aliyuncs.com → 支持 thinking+search；deepseek.com → 都不支持。
      # ⚠️ 未命中的服务商**不下发任何额外参数**（宁可少一个开关，也不要 400），
      #    此时启动日志会提示；中转/代理服务在此声明即可：
      # providers:
      #   my-gateway.example.com:
      #     thinking: true
      #     search: true
      providers: {}
    quota:
      # 是否启用 token 配额校验（P2-8）。关闭后不再拦截超支用户，但用量仍会照常累加
      enabled: true
      # 新注册用户的默认 token 配额；<=0 表示不限制（默认）。
      # 存量用户不受影响（users.token_quota 为 NULL 同样视为不限制）；
      # 要限制谁就在库里给 users.token_quota 设值。见 docs/sql/003_add_user_token_quota.sql
      default-quota: 0
      # 配额重置周期：NONE=不重置（累计，与 003 原行为一致）/ DAILY / MONTHLY。
      # 这是全局默认，单个用户可在库里覆盖：
      #   UPDATE users SET token_period='MONTHLY' WHERE id=...;
      # 重置是**惰性**的（对话前校验配额时顺手判断），没有定时任务。
      # 需先执行 docs/sql/007_add_user_token_quota_period.sql
      period: NONE

# ---------------------------------------------------------------------------
# P3-4：API 文档（SpringDoc / Swagger UI）
# ---------------------------------------------------------------------------
# ⚠️ 生产默认**关闭**：接口清单（URL、参数、返回的字段结构）属于敏感信息，
#    对外暴露等于把整个后端的攻击面画成地图给出去。
# 需要临时打开时（例如线上联调）把两个 enabled 改成 true 即可，
#   Swagger UI 地址：http://<host>:<port>/swagger-ui.html
#   原始 OpenAPI JSON：http://<host>:<port>/v3/api-docs
# 注意：`LoginCheckInterceptor` 的白名单里放了 swagger 相关路径（不带 token 也能访问），
#    所以这里是**唯一**的开关 —— 打开即对外可读。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
