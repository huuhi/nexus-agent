langchain4j:
  open-ai:
    chat-model:
      model-name: moonshot-v1-8k
      base-url: https://api.moonshot.cn/v1
      api-key: ${MOONSHOT}
    streaming-chat-model:
      model-name: deepseek-v4-flash
      base-url: https://api.deepseek.com
      custom-parameters:
        enable_search: true
        enable_thinking: true
      api-key: ${DEEPSEEK}
      return-thinking: true
    embedding-model:
      api-key: ${AI_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: text-embedding-v4
      dimensions: 1024

spring:
  datasource:
    # 注意：多个 JDBC 参数之间必须用 & 分隔。
    # 历史上这里是 ...=true?stringtype=unspecified，第二个 '?' 让整个 query 被解析成一个
    # 参数值，导致 reWriteBatchedInserts 与 stringtype 双双失效；
    # 而 stringtype=unspecified 是 chat_memory.content::jsonb 等写入正常工作的前提。
    url: jdbc:postgresql://${SERVICE_IP}:5432/nexus_agent?reWriteBatchedInserts=true&stringtype=unspecified
    password: postgres
    username: postgres
    hikari:
      maximum-pool-size: 100
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 550000
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 60000
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  aliyun:
    bucket-name: nexus-agent-file
    region: cn-guangzhou
    endpoint: https://oss-cn-guangzhou.aliyuncs.com
    image-dir: user/avatar
    file-dir: user/file
  data:
    redis:
      host: ${SERVICE_IP}
      password: redis

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

# ============================================================================
#  nexus-agent 运行时参数（全部有代码默认值，不写这段也能启动）
# 对应类：com.huzhijian.nexusagentweb.properties.AgentProperties
# ============================================================================
nexus:
  agent:
    sse:
      # SSE 连接超时。必须大于最慢一次模型调用的耗时，否则复杂任务会被提前掐断
      timeout: 120s
    memory:
      # 对话记忆窗口的 token 上限（只影响送给模型的上下文，不影响已入库的消息）
      max-tokens: 100000
      # token 估算器使用的模型名。注意它只用于本地估算，不产生 API 调用；
      # 与真实使用的模型不一致会导致窗口裁剪不准，换主力模型时建议同步改
      token-estimator-model: gpt-4o
    sandbox:
      # 是否按会话复用沙盒。开启后同一会话内多次工具调用复用同一个沙盒（E2B 按量计费）
      reuse-per-session: true
      # 沙盒空闲多久后被后台任务主动销毁。
      # ⚠️ 必须小于沙盒服务里的 set_timeout(600)，否则还没轮到我们回收就被 E2B 收走了
      idle-timeout: 8m
      # 回收任务的执行间隔（毫秒，或 ISO-8601 时长）
      sweep-interval: 60000
    mcp:
      # MCP 客户端健康检查超时
      health-timeout: 5s
      # 是否缓存复用 MCP 客户端（关闭会导致每轮对话新建连接，必然泄漏）
      cache-clients: true
