langchain4j:
  open-ai:
    chat-model:
      model-name: moonshot-v1-8k
      base-url: https://api.moonshot.cn/v1
      api-key: ${MOONSHOT}
    streaming-chat-model:
      model-name: deepseek-v4-flash
      base-url: https://api.deepseek.com
      # ⚠️ 这里是**系统默认模型**的固定额外参数（由 langchain4j starter 直接下发，
      #    不经过 nexus.agent.model.providers 能力表）。只放该服务商认的字段 ——
      #    不认的字段可能让请求直接 400。下面按 DeepSeek 官方接口配置（无 enable_search）；
      #    若换成阿里云百炼(qwen)等支持联网搜索的服务商，可自行加上 enable_search: true。
      custom-parameters:
        enable_thinking: true
      api-key: ${DEEPSEEK}
      return-thinking: true
    embedding-model:
      api-key: ${AI_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: text-embedding-v4
      dimensions: 1024

spring:
  datasource:
    # 注意：多个 JDBC 参数之间必须用 & 分隔。
    # 历史上这里是 ...=true?stringtype=unspecified，第二个 '?' 让整个 query 被解析成一个
    # 参数值，导致 reWriteBatchedInserts 与 stringtype 双双失效；
    # 而 stringtype=unspecified 是 chat_memory.content::jsonb 等写入正常工作的前提。
    url: jdbc:postgresql://${SERVICE_IP}:5432/nexus_agent?reWriteBatchedInserts=true&stringtype=unspecified
    password: postgres
    username: postgres
    hikari:
      maximum-pool-size: 100
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 550000
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 60000
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  aliyun:
    bucket-name: nexus-agent-file
    region: cn-guangzhou
    endpoint: https://oss-cn-guangzhou.aliyuncs.com
    image-dir: user/avatar
    file-dir: user/file
  data:
    redis:
      host: ${SERVICE_IP}
      password: redis

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

# ============================================================================
#  nexus-agent 运行时参数（全部有代码默认值，不写这段也能启动）
# 对应类：com.huzhijian.nexusagentweb.properties.AgentProperties
# ============================================================================
nexus:
  agent:
    sse:
      # SSE 连接超时。必须大于最慢一次模型调用的耗时，否则复杂任务会被提前掐断
      timeout: 120s
      # 流式增量合并（P2-12）：攒够这么多字符就推一帧。
      # 调大 → SSE 帧更少、前后端更省，但首字/整段到达略慢；调小 → 更"实时"但帧多、前端渲染压力大
      flush-max-chars: 200
      # 兜底时间阈值：距上次推送超过这么久就推一帧（60ms ≈ 16 帧/秒，与屏幕刷新率相当）
      flush-interval: 60ms
    memory:
      # 对话记忆窗口的 token 上限（只影响送给模型的上下文，不影响已入库的消息）
      max-tokens: 100000
      # token 估算器使用的模型名。注意它只用于本地估算，不产生 API 调用；
      # 与真实使用的模型不一致会导致窗口裁剪不准，换主力模型时建议同步改
      token-estimator-model: gpt-4o
    sandbox:
      # 是否按会话复用沙盒。开启后同一会话内多次工具调用复用同一个沙盒（E2B 按量计费）
      reuse-per-session: true
      # 沙盒空闲多久后被后台任务主动销毁。
      # ⚠️ 必须小于沙盒服务里的 set_timeout(600)，否则还没轮到我们回收就被 E2B 收走了
      idle-timeout: 8m
      # 回收任务的执行间隔（毫秒，或 ISO-8601 时长）
      sweep-interval: 60000
    mcp:
      # MCP 客户端健康检查超时
      health-timeout: 5s
      # 是否缓存复用 MCP 客户端（关闭会导致每轮对话新建连接，必然泄漏）
      cache-clients: true
    security:
      # 是否启用登录鉴权。默认 true（安全优先）。
      # ⚠️ 本地调试若不想带 token，请在这里（自己不提交的 application-dev.yml）显式设为 false，
      #    不要注释掉 WebInterceptorConfig 上的 @Configuration —— 那样没有任何痕迹、容易误提交。
      #    关闭时启动日志会打 WARN 提醒。
      enabled: true
    skill:
      # 是否启用技能（本地目录扫描）
      enabled: true
      # 技能根目录：每个子目录一个技能，内含 SKILL.md（frontmatter 提供 name/description）
      # 目录约定与用法见 skills/README.md
      root-dir: skills
      # 目录扫描结果缓存时长。新增技能最多延迟这段时间生效，不需要重启
      refresh-interval: 60s
    startup:
      # 启动配置自检发现「必需配置缺失」时是否直接阻止启动。
      # true（默认）：fail-fast，启动日志会一次性列出缺哪些、各自什么后果
      # false：降级为 WARN 继续启动，仅建议临时排查问题时用
      fail-fast: true
    tools:
      # 工具发起的 HTTP 调用（沙盒服务）响应超时。
      # ⚠️ 刻意小于 sse.timeout(120s)：这样超时先由工具层抛出，
      #    变成结构化的 TIMEOUT 结果回给模型，而不是把整条 SSE 流掐断。
      #    长任务（沙盒里装依赖、跑大数据量脚本）可调大，但别超过 sse.timeout。
      http-timeout: 100s
      # 重复调用治理：同一会话内「同一工具 + 完全相同的参数」在窗口内超过阈值即拦截，
      # 返回 DUPLICATE_CALL 结构化结果 + 自纠提示。设为 0 关闭该治理。
      duplicate-window: 60s
      duplicate-threshold: 2
    observability:
      # 是否输出每次运行的汇总日志：
      #   RUN runId=... session=... model=... cost=7.6s tokens=1234/567/1801(in/out/total)
      #       fee=¥0.0071 tools=3 seq=[create_box,execute_cmd] result=OK
      enabled: true
      # 模型单价（每 100 万 token，单位：元）。**故意不给默认值** —— 各厂商价格经常变动，
      # 写死在代码里必然过时并给出错误金额；没配的模型汇总里显示 fee=unpriced（明确表示"不知道"）。
      # 匹配规则：先精确匹配模型名，再按最长前缀匹配（配 deepseek 即可覆盖 deepseek-v4-flash）。
      # 示例（价格请以厂商官网为准）：
      # model-prices:
      #   deepseek:
      #     input: 2.0
      #     output: 8.0
      model-prices: {}
    model:
      # 服务商能力表（P2-3）：key = baseUrl 中包含的片段，决定「给该服务商下发哪些额外参数」。
      # 内置：dashscope.aliyuncs.com → 支持 thinking+search；deepseek.com → 都不支持。
      # ⚠️ 未命中的服务商**不下发任何额外参数**（宁可少一个开关，也不要 400），
      #    此时启动日志会提示；中转/代理服务在此声明即可：
      # providers:
      #   my-gateway.example.com:
      #     thinking: true
      #     search: true
      providers: {}
    quota:
      # 是否启用 token 配额校验（P2-8）。关闭后不再拦截超支用户，但用量仍会照常累加
      enabled: true
      # 新注册用户的默认 token 配额；<=0 表示不限制（默认）。
      # 存量用户不受影响（users.token_quota 为 NULL 同样视为不限制）；
      # 要限制谁就在库里给 users.token_quota 设值。见 docs/sql/003_add_user_token_quota.sql
      default-quota: 0
