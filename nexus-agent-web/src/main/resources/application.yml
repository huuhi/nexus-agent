# ---------------------------------------------------------------------------
# ⚠️ 同一个 YAML 文件里**不允许出现两个同名的顶层键**（比如写两次 `spring:`）。
#    Spring Boot 的 YAML 加载器会直接抛 `found duplicate key spring` —— **应用起不来**，
#    而且报错只在启动瞬间出现一次，很容易被误判成"环境有问题"。
#    下面所有 spring.* 配置必须写在这**一个**块里。
# ---------------------------------------------------------------------------
spring:
  application:
    name: nexus-agent-web
  profiles:
    active: prod
  threads:
    virtual:
      enabled: true
  lifecycle:
    # P3-3 优雅停机的等待上限，到期强制关闭。太长会让 `docker stop` 卡到 Docker 的 10s
    # 超时后被 SIGKILL（等于白配优雅停机）；30s 够一次长对话收尾。
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      # Spring Boot 默认只有 1MB，而知识库文档（pdf/docx）动辄几 MB，1MB 一上传就报错。
      # 与 SkillController.MAX_UPLOAD_BYTES（8MB）配合：这里拦传输层，那里再校验一次。
      # ⚠️ max-file-size 是**单个文件**上限，max-request-size 是**整个请求**上限 ——
      #    POST /api/file 支持一次传多个文件，所以后者必须明显大于前者，别写成一样大。
      max-file-size: 20MB
      max-request-size: 30MB
      # ⚠️ 刻意**不开** resolve-lazily：一旦开启，超限会在 Controller 里真正读流时才炸，
      #    异常不再是 MaxUploadSizeExceededException，全局处理器抓不到（又变 500）。
logging:
  level:
    com:
      huzhijian:
        nexusagentweb: debug

# ---------------------------------------------------------------------------
# P3-3：优雅停机 + 健康检查
# ---------------------------------------------------------------------------
server:
  tomcat:
    # 🔴 上传报 502 的元凶（2026-10-04）：
    #    Tomcat 在「响应已生成、但请求体还没读完」时，会去把剩余请求体吞掉（swallow）。
    #    吞不完（超过 max-swallow-size）就**直接掐断连接**，响应根本发不出去 ——
    #    网关 / Vite 代理看到的就是 **502**，后端日志只剩一条
    #    `SocketTimeoutException at NioEndpoint$NioSocketWrapper.fillReadBuffer`，极难排查。
    #    默认 max-swallow-size 只有 2MB：传一个 10MB 文件被 multipart 上限拒掉后，
    #    剩下 8MB 吞不完 → 断连 → 502。
    #    -1 = 不限制，保证任何时候都能返回我们自己的错误提示；
    #    代价只是超大文件多耗一点入站带宽（上传已被 max-file-size 挡在 20MB）。
    max-swallow-size: -1
    # 读请求体的超时（默认 60s）。弱网传大文件容易被掐断，放宽到 120s。
    # 注意网关（Nginx/Vite proxy）那边也要同步放宽，否则先超时的是网关。
    connection-timeout: 120s
  # 优雅停机：收到 SIGTERM 后**先停止接收新请求**，等正在处理的请求跑完才退出。
  # 容器/编排环境（`docker stop`、k8s 滚动更新）默认就是发 SIGTERM ——
  # 不配这项等于把"对话进行到一半"的连接直接掐断，SSE 会断在半句上。
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        # ⚠️ 只开 health / info。**永远不要**加 env / heapdump / threaddump / beans：
        # `/actuator/env` 会把数据库密码、各家 API Key 原样吐出来（连脱敏都没有）。
        include: health,info
  endpoint:
    health:
      # 对外只给 `{"status":"UP"}`：组件细节里带库名、Redis 地址等拓扑信息。
      # 而 /actuator/health 是免鉴权的（容器健康检查访问不了带 token 的接口），
      # 所以这里必须是 never。
      show-details: never
      # 额外给出 /actuator/health/liveness 与 /readiness，供 k8s 探针使用
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# P3-4：API 文档（SpringDoc）。默认开启，方便本地联调与前端对接；
# ⚠️ prod 环境由 application-prod.yml 关闭（接口清单属于敏感信息，不该对外暴露）。
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# ---------------------------------------------------------------------------
# 跨域（CORS）—— 前后端分离时才需要
# ---------------------------------------------------------------------------
nexus:
  agent:
    cors:
      # 前端跑在别的端口（Vite 默认 5173）时**必须开**，否则浏览器把请求直接拦掉，
      # 而且 F12 网络面板里看不到任何响应内容，很容易误判成"接口挂了"。
      # 同源部署（Nginx 把前端和 /api 挂在一个域名下）就**不需要**开。
      enabled: true
      # 允许的前端来源，逗号分隔。支持 http://localhost:* 这种通配写法。
      # ⚠️ 生产环境请列**精确域名**，不要写 '*' —— 那等于任何网站都能读取本服务的响应。
      # ⚠️ 只填来源（协议 + 域名 + 端口），**不要带路径**、也不要以 / 结尾。
      allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://120.235.30.202:5173