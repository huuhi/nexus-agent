# ============================================================================
#  nexus-agent —— **服务器部署**用（只起应用 + 沙盒服务，PG / Redis 走外部）
# ----------------------------------------------------------------------------
#  与根目录 docker-compose.yml 的区别（别选错文件）：
#    · docker-compose.yml        = 一键起**全套**（PG + Redis + box + app），本地开发用。
#                                  ⚠️ 它会新建一个空的 PG，并且首次启动会执行
#                                  docs/sql/001_baseline.sql（**会 DROP 全表**）。
#    · docker-compose.server.yml = 服务器部署用。数据库与 Redis 用**外部已有的**，
#                                  只起 app 与 box 两个容器。
#
#  用法（在服务器上，仓库根目录执行）：
#      cp .env.example .env                                   # 填真实值
#      cp nexus_agent_box/.env.example nexus_agent_box/.env    # 沙盒服务也要一份
#      docker compose -f docker-compose.server.yml up -d --build
#      docker compose -f docker-compose.server.yml ps          # 两个都要 healthy
#      docker compose -f docker-compose.server.yml logs -f app # 看启动日志
#
#  ⚠️ 两个前提：
#  1. `SERVICE_IP` 指向的外部 PG / Redis 必须**放行这台服务器**；
#     数据库要先跑过 `docs/sql/007`（缺 token_period 列 → 登录直接 500）。
#  2. `NEXUS_AGENT_CORS_*` 不要写在这个文件里 —— 前后端分离部署时，往 `.env` 里加两行即可
#     （`environment:` 优先级高于 `env_file:`，写在这里会覆盖掉 `.env`）。
# ============================================================================

name: nexus-agent-server

services:
  # ---------------------------------------------------------------------------
  # 沙盒服务（FastAPI / E2B）
  # ---------------------------------------------------------------------------
  # 只在 compose 内部网络暴露 8000（用 expose 而不是 ports）：
  # 这个服务只给后端调用，没必要映射到宿主机对外。
  box:
    build:
      context: ./nexus_agent_box
    container_name: nexus-agent-box
    env_file:
      - ./nexus_agent_box/.env
    expose:
      - "8000"
    healthcheck:
      # 2026-10-07：原为 ["CMD","curl","-fsS","http://localhost:8000/docs"]，
      # 但 slim 镜像默认没有 curl，为它单独装一次要拉几 MB 的 apt 索引 ——
      # 国内服务器实测 688s 都没拉完（实测卡在 deb.debian.org），构建直接卡死。
      # 改用镜像自带的 python 做同样的探活，Dockerfile 那层 apt-get 已删除。
      # ⚠️ 仍探 /docs 而非业务接口：E2B Key 配错时业务接口拿不到 200，
      #    容器会被判成不健康反复重启，反而把真正的原因盖住。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Java 应用
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-agent-app
    depends_on:
      box:
        condition: service_healthy
    # -------------------------------------------------------------------------
    # 外部配置挂载：改模型配置**不用重新构建镜像**
    # -------------------------------------------------------------------------
    # 在仓库根目录建 conf/nexus-override.yml，把 nexus.agent.system-models
    # （以及任何想运行时改的配置）写进去，之后只改这个文件 + `restart app` 即可。
    # 完整说明见 docs/部署指南（改配置不重打包）.md
    volumes:
      - ./conf:/app/conf:ro
    environment:
      # 容器网络里用**服务名**访问沙盒服务（写 localhost 会连到 app 自己）
      BASE_URL: http://box:8000
      # 镜像里没有 application-dev.yml，必须跑 prod
      SPRING_PROFILES_ACTIVE: prod
      # 外部 yml 压过 jar 内的 application-prod.yml（实测优先级更高）。
      # 用 optional: 前缀是故意的 —— 文件不存在时不报错，容器照常起。
      # 想让配置写错时**启动就失败**（更早暴露问题），就去掉 optional:。
      SPRING_CONFIG_ADDITIONAL_LOCATION: "optional:file:/app/conf/nexus-override.yml"
      # ❗ 这里**故意不写** SERVICE_IP 与 CORS：
      #    environment: 的优先级高于 env_file:，写了就会覆盖 .env 里填的值，
      #    表现为「明明填了外部库 IP，应用却连不上」。保持这两项只由 .env 提供。
    env_file:
      - .env
    ports:
      - "8080:8080"
    restart: unless-stopped
